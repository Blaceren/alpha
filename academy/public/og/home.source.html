<!doctype html><html lang="ru"><head><meta charset="utf-8">
<style>
@font-face { font-family: "ATA Source Serif 4"; src: url("../fonts/ata/source-serif-4/source-serif-4-variable-cyrillic.woff2") format("woff2"); font-weight: 200 900; unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "ATA Source Serif 4"; src: url("../fonts/ata/source-serif-4/source-serif-4-variable-latin.woff2") format("woff2"); font-weight: 200 900; }
@font-face { font-family: "ATA Manrope"; src: url("../fonts/ata/manrope/manrope-cyrillic-wght-normal.1hmx3sz6swr8m.woff2") format("woff2"); font-weight: 200 800; unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "ATA Manrope"; src: url("../fonts/ata/manrope/manrope-latin-wght-normal.1p_a2k8qd5zhp.woff2") format("woff2"); font-weight: 200 800; }

@font-face { font-family: "ATA IBM Plex Mono"; src: url("../fonts/ata/ibm-plex-mono/ibm-plex-mono-500-latin.woff2") format("woff2"); font-weight: 500; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: #0b0d0a; color: #f3f4ef; font-family: "ATA Manrope", sans-serif; position: relative; }
.band { position: absolute; width: 60%; height: 170px; background: rgba(48, 66, 30, 0.22); transform: rotate(-28deg); }
.b1 { top: 40px; left: -14%; } .b2 { right: -12%; bottom: -20px; }
.grid { position: absolute; inset: 0; background: linear-gradient(rgba(243,244,239,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(243,244,239,.045) 1px, transparent 1px); background-size: 72px 72px; }
.logo { position: absolute; top: 64px; left: 72px; width: 130px; }
.eyebrow { position: absolute; top: 160px; left: 72px; font-family: "ATA IBM Plex Mono", monospace; font-weight: 500; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; color: #c7f76d; }
h1 { position: absolute; top: 200px; left: 72px; margin: 0; width: 960px; font-family: "ATA Source Serif 4", serif; font-weight: 400; font-size: 88px; line-height: 1.02; letter-spacing: -.02em; }
.sub { position: absolute; left: 72px; bottom: 64px; width: 760px; font-size: 24px; line-height: 1.4; color: #9ea79b; }
.corner { position: absolute; width: 74px; height: 74px; }
.c1 { top: 112px; right: 96px; border-top: 10px solid #c7f76d; border-left: 10px solid #c7f76d; }
.c2 { bottom: 64px; right: 72px; border-right: 10px solid #c7f76d; border-bottom: 10px solid #c7f76d; }
</style></head><body>
<div class="grid"></div><div class="band b1"></div><div class="band b2"></div>
<img class="logo" src="../brand/ata-logo.svg" alt="">
<div class="eyebrow">Alpha Trade Academy · среда работы с рынком</div>
<h1>ATA — инновационная платформа обучения трейдингу.</h1>
<div class="sub">Последовательный путь: понять ситуацию, сформулировать собственное решение, проверить работу и продвинуться дальше.</div>
<div class="corner c1"></div><div class="corner c2"></div>
</body></html>
