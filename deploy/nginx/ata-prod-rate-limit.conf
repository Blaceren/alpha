# ATA PREPROD edge rate limiting.
#
# http-context definitions ONLY: two maps and two zones. The rejection-status
# directive is deliberately NOT set here -- it lives inside each PREPROD
# server block so an unrelated future site cannot inherit it.
#
# The key is $binary_remote_addr: the address nginx measured on the TCP peer.
# No client-supplied forwarding header participates -- the ingress overwrites
# both X-Real-IP and X-Forwarded-For with $remote_addr, and no real_ip
# directive is configured anywhere on this server.
#
# An EMPTY key means "not rate limited" in nginx, so HTML navigation,
# /_next/static assets and the ACME challenge are untouched by construction.

# Tier 1 -- unauthenticated auth surface.
map $uri $ata_prod_auth_key {
    default                                      "";
    ~^/api/backend/auth/(login|register|logout)$ $binary_remote_addr;
    ~^/api/crm/auth/(login|logout)$              $binary_remote_addr;
}

# Tier 2 -- every other /api request. The auth paths map to "" so a request is
# counted by exactly one tier, never both. Regex entries are evaluated in order
# of appearance, so these exclusions must precede the generic ~^/api/ entry.
map $uri $ata_prod_api_key {
    default                                      "";
    ~^/api/backend/auth/(login|register|logout)$ "";
    ~^/api/crm/auth/(login|logout)$              "";
    ~^/api/                                      $binary_remote_addr;
}

# Tier 3 -- the public acquisition surface (/go/{publicCode}).
#
# WHY A THIRD TIER AND NOT THE api TIER. Acquisition is not an /api path, so
# $ata_prod_api_key resolves to the "" default for it and `limit_req
# zone=ata_prod_api` inside a /go/ location is a SILENT NO-OP -- it reads as
# protection and enforces nothing. Adding ~^/go/ to the api map would fix that
# but would make an unauthenticated stranger's clicks and a signed-in learner's
# API calls share one per-IP budget: a click flood from a NAT would throttle a
# real learner behind the same address. A disjoint tier keeps the existing
# invariant that a request is counted by exactly one tier.
#
# The rate is the api tier's 2r/s. A human click is one request; the budget is
# spent by automation, and the application applies its own per-route limit
# behind this one.
map $uri $ata_prod_acquisition_key {
    default    "";
    ~^/go/     $binary_remote_addr;
}

limit_req_zone $ata_prod_auth_key        zone=ata_prod_auth:10m rate=20r/m;
limit_req_zone $ata_prod_api_key         zone=ata_prod_api:10m  rate=2r/s;
limit_req_zone $ata_prod_acquisition_key zone=ata_prod_acq:10m  rate=2r/s;
