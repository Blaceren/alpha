# ATA PREPROD public edge.
#
# Routing contract:
#   alfatrade.media      -> Academy  (127.0.0.1:3050)
#       Academy serves /api/backend/* itself as a BFF and talks to Backend
#       server-to-server. nginx NEVER proxies to Backend directly.
#   crm-alfatrade.media  -> CRM      (127.0.0.1:3010)
#       The CRM Next rewrites are the only public CRM->Backend path.
#
# Deliberately absent: HSTS, CSP, any direct /api/* -> Backend location, and
# any /go/* Backend proxy (affiliate attribution is disabled, routing deferred).
# IPv4-only on purpose: DNS publishes no AAAA for either hostname.

# ------------------------------- HTTP :80 -------------------------------

server {
    listen 80 default_server;
    server_name _;

    # Unknown Host or direct-IP: close without a response.
    return 444;
}

server {
    listen 80;
    server_name alfatrade.media crm-alfatrade.media
                partners-alfatrade.media;

    # Renewals must keep working over plain HTTP, so this stays ahead of the
    # redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------ HTTPS :443 ------------------------------

# Unknown SNI / direct-IP TLS: refuse the handshake. No certificate is
# presented and neither application is reachable this way.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    ssl_protocols TLSv1.2 TLSv1.3;
}

# --- Academy ---
server {
    listen 443 ssl;
    server_name alfatrade.media;

    ssl_certificate     /etc/letsencrypt/live/ata-prod/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ata-prod/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ---- G3-PREPROD-PUBLIC-ACCESS-CONTROL-1: the outer access gate ----------
    #
    # PREPROD is a real hostname on the public internet with a real certificate,
    # and it was discovered: link-preview crawlers reached /register and an
    # unrelated member of the public completed a genuine registration. The
    # product's own Turnstile and authentication worked exactly as designed —
    # they are meant to admit real people, and this environment must not admit
    # any.
    #
    # So the gate sits OUTSIDE the product, before anything is rendered. It is
    # deliberately the whole host: not /register alone, because the shell, the
    # lesson routes and the BFF are equally not for public eyes, and a
    # path-by-path list is a list someone will forget to extend.
    #
    # It does NOT replace or weaken anything: Turnstile, learner auth, staff
    # auth, CSRF and the rate limits below are all untouched and still apply
    # after this gate. This only decides who may reach them.
    # ---- ACADEMY PREPROD PUBLIC ACCESS (owner decision, 2026-08-29) ---------
    #
    # The outer Basic Auth gate is REMOVED FOR THIS HOSTNAME ONLY, so that a
    # visitor following a link reaches Public Home without an infrastructure
    # password. Public Home is a marketing surface and renders no learner data.
    #
    # IT IS REMOVED HERE AND NOWHERE ELSE. crm-alfatrade.media and
    # partners-alfatrade.media keep `auth_basic` at server scope,
    # unchanged, in their own blocks below.
    #
    # IT WEAKENS NO APPLICATION BOUNDARY. Turnstile, learner auth, staff auth,
    # CSRF and the rate limits are untouched, and every authenticated surface
    # still answers 307 to /login for an anonymous visitor — that guard is the
    # application's, not this file's. The `^~ /go/` acquisition entry and the
    # Pocket postback exemption are likewise unchanged.
    auth_basic off;
    # ------------------------------------------------------------------------
    # ------------------------------------------------------------------------

    # Backend health/readiness stay private. These are not Academy routes and
    # must never become publicly reachable through this hostname.
    location = /api/health {
        return 404;
    }

    location = /api/readiness {
        return 404;
    }

    # ---- ATTRIBUTION-ACTIVATION-1: the public acquisition entry ------------
    #
    # (ATA-PREPROD-POCKET-DEP-RDEP-FINANCIAL-INGRESS-AND-ATTRIBUTION-1.
    #  Replaces the `return 404` that deferred /go/* Backend routing.)
    #
    # WHY THIS IS THE SECOND, AND ONLY OTHER, PUBLIC SURFACE ON THIS HOST. An
    # acquisition click arrives from a stranger who has no ATA credential and
    # never will: that is what an advertising click IS. The human access gate
    # cannot apply to it for the same structural reason it cannot apply to the
    # provider callback. Everything else on both hostnames keeps `auth_basic`
    # at server scope and inherits it unchanged.
    #
    # WHY THE BACKEND AND NOT THE ACADEMY. The route lives in the Backend
    # (src/app/go/[publicCode]/route.ts) and is the only writer of
    # AffiliateClick. The Academy on :3050 has no such route and answers a
    # generic redirect, which would silently swallow every click.
    #
    # WHY `^~ /go/` AND NOT A REGEX OR A BARE PREFIX. `^~` takes priority over
    # regex locations, so nothing added later can quietly capture acquisition
    # traffic first. The TRAILING SLASH keeps `/goo/`, `/gopher/`, `/go-live`
    # and `/governance` OUT of this block -- they fall through to `location /`
    # and the full access gate, verified.
    #
    # ONE MEASURED EXCEPTION, AND IT IS NGINX'S OWN. A prefix location ending
    # in `/` that is served by `proxy_pass` answers a bare `/go` with a 301 to
    # `/go/` -- documented nginx behaviour, and it happens in this block, so it
    # precedes the access gate. That is not a hole: the redirect target is this
    # same public surface, it reveals only that a public acquisition entry
    # exists (which is what an affiliate publishes), and following it reaches
    # the Backend's fail-closed 404. No gated resource is reachable through it.
    #
    # NORMALISATION, MEASURED RATHER THAN ASSUMED:
    #   * `/go/../api/health` and `/go/%2e%2e/api/health` normalise OUT of this
    #     block and are gated -- the exemption cannot be traversed out of;
    #   * `..%2f` is decoded before matching and behaves identically;
    #   * `//go/x` and `/go//x` match here via merge_slashes, and because
    #     `proxy_pass` carries no URI part the ORIGINAL uri reaches the Backend,
    #     which answers a relative same-origin 308 to the normalised path.
    # The route requires a code, so a prefix without one has nothing to serve.
    #
    # WHAT PROTECTS IT INSTEAD OF BASIC AUTH:
    #   * GET only, refused at the edge — a tracking link is a link;
    #   * the application answers an identical 404 for absent, malformed,
    #     draft, paused, archived and feature-disabled codes, so a stranger
    #     cannot probe a 32-character code or watch a campaign start and stop;
    #   * the destination is a compiled same-origin path, so no open redirect
    #     is representable;
    #   * the Backend applies its own per-route abuse limit on top of the edge
    #     budget below.
    location ^~ /go/ {
        # Sanitised access log: $uri, never $request. The publicCode in the path
        # is public by definition — it is what an affiliate distributes — but
        # the QUERY carries partner sub-IDs, and those are partner data. Reusing
        # the postback format keeps them out of the file. Its own log so
        # acquisition traffic and provider traffic never share a stream.
        access_log /var/log/nginx/ata-acquisition.log postback_noquery;

        # The exact-prefix exemption from the human access gate.
        auth_basic off;

        # GET is the whole contract. (HEAD rides along with GET in nginx.) The
        # route exports only GET, so anything else would reach a 405 anyway —
        # refusing at the edge means it never reaches the application at all.
        limit_except GET {
            deny all;
        }

        proxy_pass http://127.0.0.1:3100;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;

        # A tracking link carries no body.
        client_max_body_size 1k;

        # The dedicated acquisition tier. NOT ata_prod_api: that zone is keyed
        # on a map that yields "" for any non-/api URI, and nginx skips an empty
        # key, so `limit_req zone=ata_prod_api` HERE WOULD ENFORCE NOTHING.
        # The auth zone is empty for /go/ for the same reason. Tier 3 in
        # conf.d/ata-preprod-rate-limit.conf exists precisely for this block.
        #
        # 2 r/s sustained, burst 20 nodelay: a human click is one request, so the
        # budget is only ever spent by automation, and the Backend applies its
        # own per-route abuse limit behind this one.
        limit_req_status 429;
        limit_req zone=ata_prod_acq burst=20 nodelay;
    }

    # ---- POCKET-REG-INGRESS-1: the exact public provider callback -----------
    # (ATA-PREPROD-POCKET-REG-INGRESS-ENABLEMENT-AND-ACTIVATION-1, 2026-08-14.
    #  Supersedes the G4-H7 comment block; the two G4-H7 log directives below
    #  are preserved byte-identically and remain the accepted logging boundary:
    #  ops/nginx/PREPROD_POSTBACK_LOGGING_HANDOFF.conf, sha256 027a96f9….)
    #
    # WHAT CHANGED, AND WHY — three deliberate corrections, nothing else:
    #
    #   1. UPSTREAM 3050 -> 3100. This exact route used to proxy to the Academy,
    #      which has no such path and answered 404. The canonical receiver is the
    #      Backend (`/api/postbacks/pocket`, GET, fail-closed), on 127.0.0.1:3100.
    #      This is the ONLY location on either hostname that reaches the Backend
    #      directly; `=` keeps it exact, so no other Backend route is exposed —
    #      a trailing slash, a case variant or any sibling path still falls
    #      through to `location /` and the full access gate.
    #
    #   2. auth_basic off — FOR THIS EXACT PATH ONLY. An external provider
    #      cannot present the human Basic Auth credential, so the G3 outer gate
    #      made every real Pocket delivery die with 401 before the application
    #      could refuse or accept it. The gate is NOT weakened for anything
    #      else: both hostnames keep `auth_basic` at server scope, every other
    #      location inherits it unchanged, and this path substitutes a STRONGER
    #      machine gate — the Backend's own fail-closed provider authentication
    #      (timing-safe shared secret, per-IP budgets, goal allowlist, and 503
    #      while the capability is disabled). Reachable is not enabled.
    #
    #   3. limit_except GET — the receiver's documented contract is GET-only
    #      (Pocket sends GET postbacks; the route exports only GET). Every other
    #      method is refused at the edge with 403 before touching the Backend.
    #
    # Rate limits, timeouts, buffering, body limit and the proxy header set are
    # copied verbatim from `location /` in this same server block, unchanged
    # from the accepted G4-H7 state. The `ata_prod_api` zone keys every
    # /api/* URI including this one (2 r/s sustained, burst 40, nodelay, 429):
    # provider-appropriate at PREPROD scale — Pocket delivers one REG per
    # learner plus bounded retries, and 429/503 are retry-safe in its contract —
    # while the Backend additionally enforces its own provider-shaped budgets
    # (600/min accepted traffic, 20/min auth failures, per IP).
    location = /api/postbacks/pocket {
        # Sanitised access log: $uri, never $request. Method, path, status,
        # bytes and timing survive; the query string — and the credential in
        # it — is never written.
        access_log /var/log/nginx/ata-postback.log postback_noquery;

        # error_log has no format directive, so log_format cannot sanitise it:
        # nginx writes the ORIGINAL REQUEST LINE into upstream-failure entries.
        # Raising this ONE location to `crit` suppresses those `error`-level
        # messages here only. Every other location, every other site and every
        # crit/alert/emerg condition keeps its normal logging. The upstream
        # failure itself stays visible as a 502/504 in the access log above.
        error_log /var/log/nginx/ata-postback-error.log crit;

        # The exact-path exemption from the human access gate (decision above).
        auth_basic off;

        # GET is the whole provider contract. (HEAD rides along with GET in
        # nginx; the Backend answers it as a bodyless GET of a fail-closed
        # route.) POST, PUT, DELETE and everything else: 403 at the edge.
        limit_except GET {
            deny all;
        }

        proxy_pass http://127.0.0.1:3100;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        client_max_body_size 1m;
        limit_req_status 429;
        limit_req zone=ata_prod_auth burst=10 nodelay;
        limit_req zone=ata_prod_api burst=40 nodelay;
    }
    # ------------------------------------------------------------------------

    location / {
        proxy_pass http://127.0.0.1:3050;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        client_max_body_size 1m;
        limit_req_status 429;
        limit_req zone=ata_prod_auth burst=10 nodelay;
        limit_req zone=ata_prod_api burst=40 nodelay;
    }
}

# --- CRM ---
server {
    listen 443 ssl;
    server_name crm-alfatrade.media;

    ssl_certificate     /etc/letsencrypt/live/ata-prod/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ata-prod/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ---- G3-PREPROD-PUBLIC-ACCESS-CONTROL-1: the outer access gate ----------
    #
    # PREPROD is a real hostname on the public internet with a real certificate,
    # and it was discovered: link-preview crawlers reached /register and an
    # unrelated member of the public completed a genuine registration. The
    # product's own Turnstile and authentication worked exactly as designed —
    # they are meant to admit real people, and this environment must not admit
    # any.
    #
    # So the gate sits OUTSIDE the product, before anything is rendered. It is
    # deliberately the whole host: not /register alone, because the shell, the
    # lesson routes and the BFF are equally not for public eyes, and a
    # path-by-path list is a list someone will forget to extend.
    #
    # It does NOT replace or weaken anything: Turnstile, learner auth, staff
    # auth, CSRF and the rate limits below are all untouched and still apply
    # after this gate. This only decides who may reach them.
    auth_basic           "ATA PROD";
    auth_basic_user_file /etc/nginx/prod-access.htpasswd;
    # ------------------------------------------------------------------------

    # No Backend location on this hostname, by contract.
    location / {
        proxy_pass http://127.0.0.1:3010;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        client_max_body_size 1m;
        limit_req_status 429;
        limit_req zone=ata_prod_auth burst=10 nodelay;
        limit_req zone=ata_prod_api burst=40 nodelay;
    }
}

# =============================================================================
# ATA-PREPROD-AFFILIATE-PLATFORM-END-TO-END-1 §32 — the partner console host.
#
# THE THIRD HOSTNAME, AND WHY IT IS A HOSTNAME. The existing convention is one
# hostname per application, and here it is a security requirement rather than a
# habit. A path prefix on alfatrade.media would put the partner console
# on the SAME ORIGIN as the learner product: an XSS in either would own the
# other, and the partner session cookie would ride along on every Academy
# request. A distinct PORT fixes the origin but not the cookie, because cookies
# are not port-scoped. Only a distinct hostname separates both.
#
# IT ADDS NO PUBLIC EXEMPTION. Unlike `^~ /go/` and the Pocket callback, every
# path here sits behind the PREPROD Basic Auth gate at SERVER scope, with no
# location-level exemption anywhere in this block. A partner console has no
# external caller that cannot present a credential.
#
# IT EXPOSES NO BACKEND ROUTE. nginx never reaches :3100 from this hostname.
# The partner app proxies an explicit, reviewed list of paths server-to-server;
# a wildcard would expose every current and future backend route through this
# origin.
# =============================================================================
server {
    listen 443 ssl;
    server_name partners-alfatrade.media;

    ssl_certificate     /etc/letsencrypt/live/ata-prod/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ata-prod/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic           "ATA PROD";
    auth_basic_user_file /etc/nginx/prod-access.htpasswd;

    # A partner console must never be framed, and every response is
    # per-principal, so nothing here is cacheable by an intermediary.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:3110;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        client_max_body_size 1m;
        limit_req_status 429;
        limit_req zone=ata_prod_auth burst=10 nodelay;
        limit_req zone=ata_prod_api burst=40 nodelay;
    }
}
