# G4-PREPROD-GROWTH-FOUNDATION-CONTROLLED-CUTOVER-2
# Applied from the accepted design in the Backend candidate
# 7df71be5a68085831bed58c3f8a69d344a68cbd7:
#   ops/nginx/PREPROD_POSTBACK_LOGGING_HANDOFF.conf
#   sha256 027a96f95969c553d138565869be33c9eb9379f6792eee0f93b09f27f5103e7f
#   (byte-identical to the parent 5fc23fa0… — the staff-session correction did
#    not touch any nginx file)
#
# STEP 1 — the log format, at http scope (log_format is only valid in `http`).
# It deliberately logs $uri, never $request, so the `ow` provider secret that
# Pocket carries in the query string is never written.

log_format postback_noquery '$remote_addr - [$time_local] '
                            '"$request_method $uri" $status $body_bytes_sent '
                            'rt=$request_time';
