# HTTP-scope directives for ATA production.
# Installed to /etc/nginx/conf.d/ata-http-scope.conf
#
# `log_format` and `limit_req_zone` are only valid in the `http` context, so
# they cannot live inside a server block and must be included from here.

# ---------------------------------------------------------------------------
# G4-GROWTH — the Pocket provider secret must never reach a log.
#
# Pocket's direct postback carries the shared secret as the `ow` QUERY
# PARAMETER: /api/postbacks/pocket?goal=dep&clickid=...&ow=<secret>
#
# nginx's default `combined` format writes `$request`, which is the full request
# line INCLUDING the query string. Under default logging the first authentic
# callback writes the live provider secret to disk in plaintext, where it is then
# read by anyone with log access and shipped to any log aggregator.
#
# This format records method, PATH ONLY (`$uri` excludes the query), status,
# bytes and timing — everything an operator needs to see callbacks arriving and
# being answered, and nothing that carries the credential.
#
# Deliberately NOT `access_log off`: that would destroy the evidence a delivery
# arrived at all, which is what an operator most needs at cutover.
# ---------------------------------------------------------------------------
log_format postback_noquery '$remote_addr - [$time_local] '
                            '"$request_method $uri" $status $body_bytes_sent '
                            'rt=$request_time';

# ---------------------------------------------------------------------------
# Rate limiting for credential endpoints.
#
# The preprod nginx carried an equivalent include (`ata-preprod-rate-limit.conf`).
# This is a production site with a public registration and login form backed by
# bcrypt — which is expensive BY DESIGN, and therefore also a cheap way for an
# unthrottled attacker to saturate 2 vCPUs. Applied per-location in the api site.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=ata_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ata_general:10m rate=30r/s;

limit_req_status 429;
