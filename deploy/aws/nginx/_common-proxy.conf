# Shared proxy settings for all three ATA upstreams.
# Included from each server block: `include /etc/nginx/snippets/ata-proxy.conf;`

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Next reads this to know the request was HTTPS. Without it, redirects and
# absolute URLs the app builds come out as http:// and break the login flow.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# The app enforces the real limits (10 MB per file, 25 MB aggregate per
# revision — see backend/src/lib/curriculum/report-attachments.ts). This is the
# outer bound: it rejects the obviously-oversized before it reaches Node, while
# leaving the app room to return its own typed errors near the boundary.
client_max_body_size 12m;

# ZAP low finding: `X-Powered-By: Next.js` was present on 21–22 responses.
# Stripped here rather than in next.config.ts so no application code changes.
proxy_hide_header X-Powered-By;

proxy_buffering on;
proxy_busy_buffers_size 16k;
proxy_buffers 8 16k;
proxy_buffer_size 16k;
