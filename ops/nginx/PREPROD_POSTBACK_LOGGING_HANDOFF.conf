# G4-GROWTH — DEPLOYMENT HANDOFF, NOT AN APPLIED CONFIGURATION.
#
# ============================================================================
# THIS FILE IS NOT LOADED BY ANYTHING. It is the exact change to apply to the
# live PREPROD nginx, by the cutover phase, BEFORE any Pocket ingest switch is
# enabled. The G4 implementation wave does not modify live nginx (§67), and
# nginx was not reloaded by it.
# ============================================================================
#
# WHY THIS MUST LAND BEFORE THE SWITCHES, NOT WITH THEM. Pocket's direct postback
# carries the shared secret as the `ow` query parameter. The live server block
# for `preprod.alfatrade.media` proxies `/api/postbacks/pocket` through its
# catch-all `location /`, which logs with nginx's default `combined` format —
# and `combined` writes `$request`, which contains the full request line
# including the query string. The first authentic callback would therefore write
# the live provider secret to `/var/log/nginx/*.log` in plaintext. Rotating a
# secret that has already been logged is more expensive than not logging it.
#
# TARGET FILE (observed 2026-08-13, read-only):
#   /etc/nginx/sites-enabled/ata-preprod.conf
#   the `server` block with `listen 443 ssl;` and
#   `server_name preprod.alfatrade.media;`
#
# That block already contains `location = /api/health`, `location =
# /api/readiness` and `location ^~ /go/` ahead of its `location /`, so it has an
# established pattern of exact-match locations preceding the catch-all. This
# change follows it exactly.
#
# ---------------------------------------------------------------------------
# STEP 1 — add the log format at HTTP scope.
#
# `log_format` is only valid in the `http` context, so it CANNOT go inside the
# server block. Put it in its own file under conf.d, beside the existing
# `ata-preprod-rate-limit.conf`, which is already an http-scope include:
#
#   /etc/nginx/conf.d/ata-postback-logging.conf
# ---------------------------------------------------------------------------

log_format postback_noquery '$remote_addr - [$time_local] '
                            '"$request_method $uri" $status $body_bytes_sent '
                            'rt=$request_time';

# ---------------------------------------------------------------------------
# STEP 2 — add this location INSIDE the `preprod.alfatrade.media` 443 server
# block, immediately after `location ^~ /go/` and BEFORE `location /`.
#
# `=` gives it exact-match precedence, so it cannot be shadowed by the prefix
# block. The proxy_pass target and headers are copied from that block's existing
# `location /` — 127.0.0.1:3050 — and must be re-verified against the file at
# apply time rather than trusted from this comment.
# ---------------------------------------------------------------------------

location = /api/postbacks/pocket {
    access_log /var/log/nginx/ata-postback.log postback_noquery;

    proxy_pass http://127.0.0.1:3050;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---------------------------------------------------------------------------
# WHAT THIS DELIBERATELY DOES NOT DO
#
#   * It does not use `access_log off`. That would destroy the evidence that a
#     delivery arrived, which is the thing an operator most needs at cutover.
#     The goal is to log the request WITHOUT logging the credential.
#
#   * It does not change the global log format. §19 forbids globally reducing
#     logging for unrelated routes, and every other path keeps `combined`.
#
#   * It does not touch the outer PREPROD access gate, the TLS configuration,
#     the rate-limit include, or the `crm-preprod.alfatrade.media` block.
#
#   * It does not remove `$request_time`. Latency carries no credential and is
#     what tells an operator whether the provider is timing out.
#
# ---------------------------------------------------------------------------
# VERIFICATION AFTER APPLYING — before enabling any Pocket switch
#
#   1. nginx -t
#   2. systemctl reload nginx        (reload, never restart)
#   3. Send a request carrying a DUMMY value in `ow` — never the real secret:
#        curl -i 'https://preprod.alfatrade.media/api/postbacks/pocket?goal=reg&ow=DUMMYNOTTHESECRET'
#      It will be refused (403 or 503, depending on the switches), which is fine:
#      the point is the log line, not the response.
#   4. Confirm the dummy value is ABSENT from the new log and from the default
#      one:
#        grep -c DUMMYNOTTHESECRET /var/log/nginx/ata-postback.log   -> 0
#        grep -c DUMMYNOTTHESECRET /var/log/nginx/access.log         -> 0
#      A non-zero count on either means the location is being shadowed or the
#      format is not applied. Do NOT proceed to enable Pocket if so.
#   5. Confirm the request WAS logged, by path:
#        grep -c '/api/postbacks/pocket' /var/log/nginx/ata-postback.log  -> 1
#
# STEP 4 is the one that matters. Step 5 is what proves the fix did not become
# a silent hole instead.
#
# ---------------------------------------------------------------------------
# REMAINING EXPOSURE THIS DOES NOT CLOSE — for the deep audit, not for silence
#
#   * Any intermediary between the client and nginx (a CDN, a load balancer, an
#     upstream WAF) logs on its own terms. PREPROD terminates TLS at this nginx
#     with no such intermediary today, so the exposure is nil now, and the
#     statement would stop being true if one were introduced.
#
#   * `error_log` can record a full URI on certain failures. It is not modified
#     here because the entries in question are produced by conditions that would
#     themselves need investigating, and suppressing them would trade a rare
#     exposure for a permanent blind spot. Named for the audit.
#
#   * The secret in a URL is visible to the SENDER's own infrastructure. That is
#     inherent to the provider's contract, not something ATA can fix — and it is
#     why the application additionally redacts `ow` before any persistence, so
#     ATA's own copies never contain it.
