# G4-GROWTH — the provider secret must never reach an access log.
#
# THE PROBLEM. Pocket's official direct postback carries its shared secret as the
# `ow` QUERY PARAMETER — `?goal=dep&clickid=…&ow=<secret>`. nginx's `combined`
# log format writes `$request`, which contains the full request line INCLUDING
# the query string. So with default logging, every Pocket callback writes the
# live provider secret to disk in plaintext, where it is then read by anyone with
# log access, shipped to any log aggregator, and kept for the retention period.
#
# THE FIX. A dedicated location for the callback path with a log format that
# records the method, the PATH ONLY (`$uri`, which excludes the query), the
# status and the byte count. Everything an operator needs to see that callbacks
# are arriving and being answered — and nothing that carries the credential.
#
# WHY NOT JUST TURN LOGGING OFF HERE. `access_log off` would also destroy the
# evidence that a delivery arrived at all, which is exactly what an operator
# needs at cutover. The point is to log the request without logging the secret.
#
# WHY NOT CHANGE THE GLOBAL FORMAT. §19 is explicit: do not globally reduce
# logging for unrelated routes. Every other path keeps its normal logging.
#
# WHAT THIS FILE IS. The docker-compose development proxy. The LIVE PREPROD nginx
# is operationally external to this repository and is NOT modified by this phase
# — the exact block to apply there is in
# `ops/nginx/PREPROD_POSTBACK_LOGGING_HANDOFF.conf`, to be applied by the
# cutover phase BEFORE any Pocket switch is enabled.

# Path, method, status and size. No `$request`, no `$query_string`, no
# `$args` — each of those would reintroduce the credential.
log_format postback_noquery '$remote_addr - [$time_local] '
                            '"$request_method $uri" $status $body_bytes_sent '
                            'rt=$request_time';

server {
  listen 80;
  server_name _;

  # The Pocket callback endpoint. Declared BEFORE `location /` and with `=` so
  # it wins exact-match precedence and cannot be shadowed by the prefix block.
  location = /api/postbacks/pocket {
    access_log /var/log/nginx/postback.log postback_noquery;

    # G4-H7. The access-log format cannot protect the ERROR log: nginx writes the
    # full request line — query string and all — into upstream-failure entries,
    # and error_log takes no format. A route-local threshold suppresses those
    # `error`-level messages for this path only. See
    # ops/nginx/PREPROD_POSTBACK_LOGGING_HANDOFF.conf for the full reasoning and
    # for what replaces the lost visibility.
    error_log /var/log/nginx/postback-error.log crit;

    proxy_pass http://trading-mvp-app-1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://trading-mvp-app-1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cache_bypass $http_upgrade;
  }
}
