  <path d="M82 66 V82 H66" fill="none" stroke="#5f8fd6" stroke-width="2.4" stroke-linecap="round"/>
  <!-- captured ascending route: 3 completed segments = tier III (Наблюдатель III) -->
  <polyline points="26,75 42,60 57,66 72,39" fill="none" stroke="#3fe0b2" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round"/>
