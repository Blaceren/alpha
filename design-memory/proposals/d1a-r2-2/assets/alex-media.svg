<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alex Curie — provisional media">
  <defs>
    <linearGradient id="ld" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33465f"/><stop offset="0.5" stop-color="#151f30"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="rim" cx="28%" cy="16%" r="62%">
      <stop offset="0" stop-color="#9cc0ea" stop-opacity=".55"/><stop offset="1" stop-color="#9cc0ea" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#ld)"/>
  <!-- directional light (top-left) -->
  <ellipse cx="30" cy="18" rx="46" ry="40" fill="url(#rim)"/>
  <!-- abstract backlit silhouette: shoulders + soft crown, deliberately no facial features -->
  <path d="M14 100 C 17 64, 33 52, 50 52 C 67 52, 83 64, 86 100 Z" fill="#0a101c" fill-opacity=".62"/>
  <path d="M38 56 C 38 40, 62 40, 62 56 C 62 66, 38 66, 38 56 Z" fill="#0a101c" fill-opacity=".55"/>
  <!-- rim light on the silhouette edge -->
  <path d="M38 56 C 38 42, 50 40, 55 41" stroke="#9cc0ea" stroke-opacity=".35" stroke-width="1.4" fill="none"/>
</svg>
